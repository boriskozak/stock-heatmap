<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Stock Heatmap</title>
    <meta name="description"
        content="Interactive S&P 500 stock heatmap with real-time performance visualization, sector grouping, and animated market cap treemap.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='%236366f1'/%3E%3Cpath d='M6 16L10 10L14 13L18 7' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='18' cy='7' r='2' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="app">
        <header id="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="1" y="1" width="22" height="22" rx="4" fill="url(#logoGrad)"
                            stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
                        <path d="M6 16L10 10L14 13L18 7" stroke="white" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <circle cx="18" cy="7" r="2" fill="white" />
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
                                <stop stop-color="#6366f1" />
                                <stop offset="1" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="logo-text">HeatMap<span class="logo-accent">Pro</span></span>
                </div>
                <div class="header-divider"></div>
                <div class="index-badge" id="indexBadge">S&P 500</div>
                <div class="market-status" id="marketStatus" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span class="status-text">Market Open</span>
                </div>
            </div>
            <div class="header-center">
                <div class="toolbar">
                    <div class="toolbar-group">
                        <label class="toolbar-label" for="sizeMetric">Size</label>
                        <select id="sizeMetric" class="toolbar-select">
                            <option value="marketCap" selected>Market Cap</option>
                            <option value="volume">Volume</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <label class="toolbar-label" for="colorMetric">Color</label>
                        <select id="colorMetric" class="toolbar-select">
                            <option value="change" selected>Daily Change %</option>
                            <option value="weekChange">Week Change %</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <label class="toolbar-label" for="grouping">Group</label>
                        <select id="grouping" class="toolbar-select">
                            <option value="sector" selected>Sector</option>
                            <option value="none">No Grouping</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="legend" id="legend">
                    <span class="legend-label">-3%+</span>
                    <div class="legend-bar"></div>
                    <span class="legend-label">+3%+</span>
                </div>
                <div class="last-update" id="lastUpdate">Updated just now</div>
            </div>
        </header>
        <main id="heatmapContainer">
            <div id="heatmap"></div>
            <canvas id="particleCanvas"></canvas>
        </main>
        <div id="tooltip" class="tooltip"></div>
    </div>
    <script src="stocks.js"></script>
    <script src="treemap.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>

</html>
